name: Build and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GLSL compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Validate local TTS helper syntax
        if: runner.os == 'Linux'
        run: |
          bash -n tools/tts/setup-local.sh
          python3 -m py_compile tools/tts/chatterbox_server.py
      - name: Validate Windows TTS setup syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/tts/setup-local.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - run: dotnet build SlavicGame.csproj --configuration Release
      - name: Verify compiled Vulkan shaders were copied to output
        if: runner.os == 'Linux'
        run: |
          test -f bin/Release/net11.0/shaders/bin/terrain.vert.spv
          test -f bin/Release/net11.0/shaders/bin/terrain.frag.spv
          test -f bin/Release/net11.0/shaders/bin/actor.vert.spv
          test -f bin/Release/net11.0/shaders/bin/actor.frag.spv
          test -f bin/Release/net11.0/shaders/bin/hud.vert.spv
          test -f bin/Release/net11.0/shaders/bin/hud.frag.spv
          test -f bin/Release/net11.0/shaders/bin/pbr.vert.spv
          test -f bin/Release/net11.0/shaders/bin/pbr.frag.spv
          test -f bin/Release/net11.0/shaders/bin/sky.vert.spv
          test -f bin/Release/net11.0/shaders/bin/sky.frag.spv
      - run: dotnet run --project tests/SlavicGame.RegressionTests.csproj --configuration Release
