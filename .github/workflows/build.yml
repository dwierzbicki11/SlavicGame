name: Build and regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GLSL compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Validate local TTS helper syntax
        if: runner.os == 'Linux'
        run: |
          bash -n tools/tts/setup-local.sh
          python3 -m py_compile tools/tts/chatterbox_server.py
          bash tools/check-tts-installer.sh
      - name: Validate Windows TTS setup syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/tts/setup-local.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate Vulkan fullscreen orientation
        if: runner.os == 'Linux'
        run: bash tools/check-render-orientation.sh
      - name: Build and validate native Linux FSR3
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y cmake g++ libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers
          bash -n tools/setup-fidelityfx.sh
          python3 -m py_compile native/fidelityfx-linux/compile_shaders.py native/fidelityfx-linux/prepare_sdk.py
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          bash tools/setup-fidelityfx.sh --test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'
      - run: dotnet build SlavicGame.csproj --configuration Release
      - name: Verify compiled Vulkan shaders were copied to output
        if: runner.os == 'Linux'
        run: |
          test -f bin/Release/net11.0/shaders/bin/terrain.vert.spv
          test -f bin/Release/net11.0/shaders/bin/terrain.frag.spv
          test -f bin/Release/net11.0/shaders/bin/actor.vert.spv
          test -f bin/Release/net11.0/shaders/bin/actor.frag.spv
          test -f bin/Release/net11.0/shaders/bin/hud.vert.spv
          test -f bin/Release/net11.0/shaders/bin/hud.frag.spv
          test -f bin/Release/net11.0/shaders/bin/pbr.vert.spv
          test -f bin/Release/net11.0/shaders/bin/pbr.frag.spv
          test -f bin/Release/net11.0/shaders/bin/sky.vert.spv
          test -f bin/Release/net11.0/shaders/bin/sky.frag.spv
      - name: Run regression checks
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            export SLAVICGAME_TEST_FSR3_NATIVE=1
            export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
            test -n "$VK_ICD_FILENAMES"
          fi
          dotnet run --project tests/SlavicGame.RegressionTests.csproj --configuration Release
      - name: Run real renderer scene FG proof
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export SLAVICGAME_TEST_FSR3_NATIVE=1
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name '*lvp*' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          dotnet build tests/renderer/SlavicGame.RendererTests.csproj --configuration Release
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          # Each process covers pending-work cleanup and two renderer lifetimes.
          # Fail immediately on either run; do not retry a failing proof.
          for attempt in 1 2; do
            dotnet tests/renderer/bin/Release/net11.0/SlavicGame.RendererTests.dll 2>&1 | tee "scene-fg-proof-$attempt.log"
            if rg -n 'Validation Error:' "scene-fg-proof-$attempt.log"; then
              exit 1
            fi
          done
